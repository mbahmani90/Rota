name: Release

# Pushing a version tag (e.g. v1.2.3) builds signed release APKs and publishes a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

# One release per tag at a time; never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the publish job may write (create the release).
permissions:
  contents: read

# Two jobs: "Build signed APKs" is the only one with the signing secrets;
# "Publish GitHub Release" is the only one with write access and never sees the keystore.
jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (must grow with every release).
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, was $GITHUB_REF_NAME"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($CODE)"

      # The keystore is stored base64-encoded in an encrypted secret; it only exists during this job.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROTA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROTA_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ROTA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # No MAPS_API_KEY: a key inside a public APK isn't secret, so releases use Overpass.
      - name: Build signed release APKs
        env:
          ROTA_KEYSTORE_PASSWORD: ${{ secrets.ROTA_KEYSTORE_PASSWORD }}
          # The alias isn't secret; as a secret, GitHub would mask the word everywhere in the logs.
          ROTA_KEY_ALIAS: rota
          ROTA_KEY_PASSWORD: ${{ secrets.ROTA_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -Prota.versionName=${{ steps.version.outputs.name }}
          -Prota.versionCode=${{ steps.version.outputs.code }}

      - name: Verify signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in automotive/build/outputs/apk/release/automotive-release.apk \
                     mobile/build/outputs/apk/release/mobile-release.apk; do
            # The exit code decides: verify fails for unsigned or broken APKs.
            "$APKSIGNER" verify "$apk"
            # Certificate details only for the log; the output format differs between versions.
            echo "$apk:"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256 digest)" || true
          done

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp automotive/build/outputs/apk/release/automotive-release.apk "dist/rota-automotive-$VERSION.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/rota-mobile-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # Hands the signed APKs and checksums to the publish job (a fresh machine).
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job allowed to write: it creates the release. No secrets, no checkout.
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      # Release notes are generated from the merged pull requests since the previous tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Rota $VERSION"
          --generate-notes
          --verify-tag
