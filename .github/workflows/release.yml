name: Release

# Pushing a version tag (e.g. v1.2.3) builds signed release APKs and publishes a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

# One release per tag at a time; never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# contents: write is needed to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (must grow with every release).
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, was $GITHUB_REF_NAME"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($CODE)"

      # The keystore is stored base64-encoded in an encrypted secret; it only exists during the run.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROTA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROTA_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ROTA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # No MAPS_API_KEY: a key inside a public APK isn't secret, so releases use Overpass.
      - name: Build signed release APKs
        env:
          ROTA_KEYSTORE_PASSWORD: ${{ secrets.ROTA_KEYSTORE_PASSWORD }}
          ROTA_KEY_ALIAS: ${{ secrets.ROTA_KEY_ALIAS }}
          ROTA_KEY_PASSWORD: ${{ secrets.ROTA_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -Prota.versionName=${{ steps.version.outputs.name }}
          -Prota.versionCode=${{ steps.version.outputs.code }}

      - name: Verify signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in automotive/build/outputs/apk/release/automotive-release.apk \
                     mobile/build/outputs/apk/release/mobile-release.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | grep "Signer #1 certificate DN"
          done

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp automotive/build/outputs/apk/release/automotive-release.apk "dist/rota-automotive-$VERSION.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "dist/rota-mobile-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # Release notes are generated from the merged pull requests since the previous tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Rota $VERSION"
          --generate-notes
          --verify-tag

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"
