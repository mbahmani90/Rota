name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the workflow only builds and tests.
# pull-requests: read lets the Changes job list a PR's changed files.
permissions:
  contents: read
  pull-requests: read

# "Changes" decides whether code changed; docs-only changes (Markdown, docs/) skip the rest.
# Then "Build"; when it succeeds, "Unit tests", "Android Lint" and "Code style" run in parallel.
# Each job runs on its own fresh machine, so each checks out and sets up JDK and Gradle.
# "CI result" is the single check to require in branch protection.
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      # Needed on pushes to main: changes are compared with git against the previous commit.
      - name: Check out
        uses: actions/checkout@v7

      # "code" is true if any changed file is something other than Markdown or docs/.
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The Gradle daemon asks for JDK 25 (gradle/gradle-daemon-jvm.properties);
      # installing it here avoids a download on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches dependencies and build outputs; also validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No MAPS_API_KEY in CI: the app builds with Overpass, and unit tests use fakes.
      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            automotive/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
          retention-days: 7

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:domain:test testDebugUnitTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  lint:
    name: Android Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7

  code-style:
    name: Code style
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ktlint (+ Compose rules) via Spotless; fix locally with ./gradlew spotlessApply
      - name: Code style
        run: ./gradlew spotlessCheck

  # One result for branch protection. Skipped jobs (docs-only change) count as success;
  # a failed or cancelled job fails this check.
  ci-result:
    name: CI result
    needs: [changes, build, unit-tests, lint, code-style]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
