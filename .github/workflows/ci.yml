name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the workflow only builds and tests.
permissions:
  contents: read

# "Build" first; when it succeeds, "Unit tests", "Android Lint" and "Code style" run in parallel.
# Each job runs on its own fresh machine, so each checks out and sets up JDK and Gradle.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The Gradle daemon asks for JDK 25 (gradle/gradle-daemon-jvm.properties);
      # installing it here avoids a download on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches dependencies and build outputs; also validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No MAPS_API_KEY in CI: the app builds with Overpass, and unit tests use fakes.
      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            automotive/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
          retention-days: 7

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:domain:test testDebugUnitTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  lint:
    name: Android Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7

  code-style:
    name: Code style
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reuses the Gradle cache, so less is compiled again than on a cold machine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ktlint (+ Compose rules) via Spotless; fix locally with ./gradlew spotlessApply
      - name: Code style
        run: ./gradlew spotlessCheck
